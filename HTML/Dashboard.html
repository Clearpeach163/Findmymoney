<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/dashboard.css">
    <link rel="shortcut icon" href="../Src/favoicon.png" type="image/x-icon">
       <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../JS/database.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
</head>
<body>
    <div class="main">
        <aside id="sidebar">
            <div class="top">
                <div id="account">
                    <div id="icon"></div>
                    <label id="account-label"></label>
                </div>
                <button class="active">nav 1</button>
                <button>nav 2</button>
                <button>nav 1</button>
                <button>nav 2</button>
            </div>
            <div class="bottom">
                <button id="logout">Log out</button>
            </div>
        </aside>

        <div id="dashboard">
            <header id="welcome">
                <div id="welcome-left">
                    <h1 id="msg">Hey ...</h1>
                    
                    <p id="trend">Looks like your spending more than usual.</p>
                </div>
                <div id="welcome-right">
                    <select name="time" class="time" id="dropdown">
                        <option value="1-week">1 Week</option>
                        <option value="1-month">1 Month</option>
                        <option value="6-months">6 Months</option>
                        <option value="ytd">YTD</option>
                        <option value="1-year">1 year</option>
                        <option value="Max">Max</option>
                        <option value="all-data"></option>
                    </select>
                        <div class="new-dropdown">
                            <button id="new" onclick="toggleDropdown()">New +</button>

                            <div id="new-menu" class="new-menu">
                                <button onclick="updateValue('balance')">Update balance</button>
                                <button onclick="updateValue('spendings')">Update spendings</button>
                                <button onclick="updateValue('earnings')">Update earnings</button>
                            </div>
                        </div>
                </div>
            </header>
            <div class="cards-window">
                <div id="balance" class="card">
                    <p>Balance</p>
                    <div id="balance-full">
                        <h1 id="balance-euro" class="amount"></h1>
                        <div id="lastmonth" class="lastmonth-amount">Error 404</div>
                    </div>
                </div>
                <div id="spending" class="card">
                    <p>Spendings</p>
                    <div id="balance-full">
                        <h1 id="spendings" class="amount"></h1>
                        <div id="spendings-lastmonth" class="lastmonth-amount">Error 404</div>
                    </div>
                </div>
                <div id="earning" class="card">
                    <p>Earnings</p>
                    <div id="balance-full">
                        <h1 id="earnings" class="amount">Error 404</h1>
                        <div id="earnings-lastmonth" class="lastmonth-amount">Error 404</div>
                    </div>
                </div>

                <div id="earning" class="card">
                    <p>Savings</p>
                    <div id="savings-full">
                        <h1 id="savings" class="amount">Error 404</h1>
                        <div id="savings-lastmonth" class="lastmonth-amount">Error 404</div>
                    </div>
                </div>

                <!--chart window-->
              
                <div id="chart-balance" class="card">
                    <p>Bank balance</p>
                    <div>
                        <canvas id="Chart-1"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../JS/Dashboard.js" type="module"></script>
    <script src="../JS/charts.js" defer></script>
    <script>

async function Write(column, value) {

    // Get logged-in user
    const { data: { user }, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !user) {
        console.error("User not logged in");
        return;
    }

    // Write to database
    const { error } = await supabaseClient
        .from("user_stats")
        .update({
            [column]: value
        })
        .eq("id", user.id);

    if (error) {
        console.error("Database error:", error);
        return false;
    }

    console.log("Saved successfully!");
        document.getElementById("new-menu").classList.remove("show");
    location.reload();
    return true;
}

function toggleDropdown() {
    document.getElementById("new-menu").classList.toggle("show");
}

async function updateValue(column) {

    const amount = Number(prompt("Enter new " + column + ":"));

    if (!Number.isFinite(amount) || amount < 0) {
        alert("Please enter a valid amount.");
        return;
    }

    await Write(column, amount);

    document.getElementById("new-menu").classList.remove("show");
}
    </script>
</body>
</html>
